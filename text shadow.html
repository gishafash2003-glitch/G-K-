<!DOCTYPE html>
<html>
    <head>
    <style>
        *{
            text-align:center;
            font-family:monospace;

        }
        #text{
            text-shadow: 2px 2px 1px #cc5500;
            /*(right-offset)px(left-offset)px(blurradius)px(color)*/

            
        }
        #box{
            box-shadow: 9px 9px 5px #301934;
            /*(right-offset)px(left-offset)px(blurradius)px(color)*/
        }
        #indent{
            text-indent: 50px; /*16px or -3em*/

        }
        </style>
        </head>
    <body>
        <h1 id="text">Text Shadow Example</h1>
        <div id="box" style="width:200px;height:100px;background-color:lightblue;margin:auto;">
            Box with Shadow
        </div>
        <p id="indent">This paragraph demonstrates text indentation. The first line of this paragraph is indented by 50 pixels from the left margin.</p>
    </body>
    
</html>
