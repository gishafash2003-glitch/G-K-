<!DOCTYPE html>
<html>
    
        <title>Typography </title>
    <style>
        .text1 {
            color:blue;

            font-size: 20px;

        }
        .p1{
            color:red;
            font-size: 16px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .di{
            text-transform: uppercase;
        }
        </style>
    <body>
        <h1 class="text1">This is a heading</h1>
        <p class="p1">This is a paragraph.</p>
        <div class="di">This text will be uppercase.</div>
    </body>

</html>
