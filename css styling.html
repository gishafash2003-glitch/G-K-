<!DOCTYPE html>
<html>
   <head>
    <title>CSS Styling Example</title>
    <!-- Internal CSS -->
    <style>
        h2{ color:green;
        }
    </style>
    <!-- Internal CSS -->
     <link rel="stylesheet"href="styles.css">
       </head> 
       <body>
        <hr><!-- inline css -->
        <h1 style="color:blue;">Welcome to CSS Styling Example</h1>
        <!-- Internal CSS -->
        <h2>INTERNAL CSS EXAMPLE</h2>
        <!-- External CSS -->
         <h3>EXTERNAL CSS EXAMPLE </h3>
         <hr>

         <!-- element selector example-->
          <h4>ELEMENT SELECTOR EXAMPLE</h4>
          <h4>ELEMENT SELECTOR EXAMPLE</h4>
          <hr>

          <!-- class and id selector example-->
           <h2 class="myclass">CLASS SELECTOR EXAMPLE</h2>
            <h2 id= color: mediumpurple;ID SELECTOR EXAMPLE</h2>
            <h2 class="myclass">CLASS SELECTOR EXAMPLE</h2>
            <hr>

            <!-- group selector example-->
              <h5 style="color:maroon;">GROUP SELECTOR EXAMPLE</h5>
              <p style="color:maroon;">GROUP SELECTOR EXAMPLE</p>
              <hr>
      </body>
</html>
